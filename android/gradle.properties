org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---- White label -------------------------------------------------------------
# Change these three to rebrand the app; nothing else needs to be touched.
bix.applicationId=pro.bixplayer.player
bix.appName=Bix Player
bix.versionName=1.0.0
bix.versionCode=1

# ---- API ---------------------------------------------------------------------
# release points at production; debug at the host machine as seen from the emulator
bix.apiBaseUrl.release=https://bixplayer.pro/
bix.apiBaseUrl.debug=http://10.0.2.2:8000/
